</style><div id="captions-root" data-composition-id="captions-track" data-width="1920" data-height="1080" data-duration="506.8" data-layout-allow-caption-zone><div id="captions" class="scene-layer" data-layout-allow-caption-zone><div id="caption-box"><p id="subtitle">I started with these two images</p></div></div></div><script>(function(){const subtitles=[[0.918416,2.9842079999999997,"I started with these two images and a"],[2.9842079999999997,5.696833,"simple prompt explaining how the puzzle works."],[7.244874666666666,8.694332666666666,"This is what Astra created."],[10.242374333333334,14.599791333333334,"The marbles can circulate around each of the three rims independently."],[16.134625,19.213583,"Turn the center and the separate tracks become one"],[19.213583,23.163041,"connected chamber where all the marbles circulate together."],[24.697916666666668,29.489499666666667,"Each outer half-rim can flip transferring marbles between the front and back."],[31.02437433333333,34.39491633333333,"And we can turn the whole model to inspect it from any angle."],[35.94295799999999,39.313456999999985,"So I asked Astra how did you construct this geometry"],[39.587666,42.65558299999999,"Let's build it step by step in Three.js."],[45.918416,50.131040999999996,"Before writing geometry code decide which parts must move together."],[51.15625,56.197833,"This puzzle has a fixed frame a central rotor and three outer halves that flip."],[57.236208,60.315166,"We give those five structural groups temporary colors"],[60.315166,62.619916,"so their boundaries are easy to follow."],[63.658249999999995,68.25245799999999,"The beads are separate meshes Removing them reveals the channels underneath."],[69.29083299999999,72.66133199999999,"The same layered construction appears on the front and the back."],[75.90525,81.275791,"Build the flat drawing in the x-y plane The z direction will become thickness."],[82.483966,87.328174,"Place three lobe centers around the origin one hundred and twenty degrees apart."],[88.523183,93.577933,"Cosine gives the horizontal coordinate sine gives the vertical coordinate."],[94.786066,99.248691,"The angles are ninety two hundred ten and three hundred thirty degrees."],[100.470033,106.130033,"Here the bead-path radius R is 0.88 and the center distance D is twice R."],[107.232958,110.10137499999999,"Draw a bead-path circle at each center The"],[110.10137499999999,112.642958,"outer shell will use its own larger radius."],[115.90525,121.117874,"Instead of drawing every edge by hand ask whether a point is inside the shape."],[122.84941666666667,127.44362466666666,"For a circle measure the distance from its center and subtract its radius."],[129.10933333333332,134.50616533333334,"A negative result means inside Zero is the boundary Positive means outside."],[136.185041,139.85820800000002,"Move the test point across the circle and watch the sign change."],[141.55024966666667,145.46020766666666,"To combine circles take the minimum of their values at each point."],[147.15229133333332,151.43070733333332,"The body combines three lobe disks with a central disk that connects them."],[153.10958300000001,157.651166,"We use the combined function as an inside-outside mask for later construction."],[160.93858333333333,164.86174933333334,"A bead channel is a band around a circle not a solid disk."],[167.02032433333332,171.10136533333332,"Take the absolute difference between distance and the bead-path radius."],[173.24677433333332,177.45939933333332,"Subtract the half-width The negative region is now a circular band."],[179.60480833333332,183.75168233333335,"Combine the bands from all three lobes to describe the complete track."],[185.91025833333333,190.84654933333334,"Keep points inside the body and outside the track to form the raised face."],[192.99195833333334,197.69145733333335,"This removes the upper material A separate lower bed becomes the channel floor."],[200.98508266666667,203.64299966666667,"The outer silhouette is not enough We must"],[203.64299966666667,206.22404066666667,"decide which material belongs to each part."],[209.54958299999998,212.867458,"A circle around the origin defines the central rotor."],[216.19299933333332,220.18195733333334,"A line through each lobe center separates its outer flipping half."],[223.50749966666666,227.11487466666665,"A dot product tells us which side of that line a point lies on."],[230.440416,233.78254099999998,"Intersect each region with the body The remaining"],[233.78254099999998,236.389916,"inner material belongs to the fixed frame."],[239.71545833333334,244.02020733333333,"Leave a small gap between neighboring parts so they can move independently."],[247.34570766666667,250.00362466666667,"Choose the rotor radius so its boundary falls"],[250.00362466666667,252.72941666666665,"between beads rather than cutting through them."],[256.02454166666666,258.34033266666665,"Three.js needs an outline that it can"],[258.34033266666665,261.97404066666667,"turn into a mesh Our traceShapes helper creates it."],[262.89008333333334,267.91849933333333,"Sample the mask on a grid then split every cell into two triangles."],[268.821375,271.124,"On each edge compare the signs at its"],[271.124,274.718208,"endpoints A sign change means the boundary crosses."],[275.62108266666667,279.63633266666665,"Interpolate between those values to estimate the zero crossing."],[280.5392083333333,283.1313333333333,"Join the crossings into closed loops A"],[283.1313333333333,286.02816533333333,"finer grid gives a more detailed approximation."],[286.931041,290.220541,"Outer loops become Shapes Enclosed empty loops"],[290.220541,292.538458,"become Paths in the shape's holes array."],[293.44129166666664,297.73287466666665,"Give hole boundaries the opposite winding direction to the outer contour."],[301.018416,306.757374,"Pass the traced shapes to ExtrudeGeometry to turn the flat outlines into solids."],[307.6762496666667,311.7704576666667,"Depth creates the side walls The front face now has real thickness."],[312.68933333333337,318.3230413333334,"Bevel size controls the edge's sideways extent bevel thickness controls its depth."],[319.24187500000005,324.204541,"Rounded edges look molded but the bevel can expand beyond the input outline."],[325.1234166666667,329.8623746666667,"At a mechanical seam that expansion can enter the neighboring part's space."],[330.79437433333334,336.45437433333336,"The project insets the mask before beveling then clamps small boundary overshoots."],[337.37325000000004,340.37325000000004,"Recompute the normals after adjusting vertices so"],[340.37325000000004,342.75691600000005,"the shading matches the final mesh."],[346.00525000000005,350.744208,"Each part combines a core a dark channel bed and raised face layers."],[352.414416,356.929707,"Matching layers sit on both sides so the puzzle has a front and a back."],[358.613041,363.18095700000003,"The pivot determines where a part rotates It is not always the world origin."],[364.86433300000004,369.695374,"Subtract the pivot from the geometry's vertices to make their coordinates local."],[371.37875,375.920291,"Then place the Group at the pivot Its meshes stay together when that Group rotates."],[377.60366600000003,382.776833,"The center turns around z Each outer half flips around its outward-pointing axis."],[386.00525000000005,391.586291,"Every bead reuses the same SphereGeometry Materials supply the different colors."],[392.800541,395.85316600000004,"There are ten evenly spaced positions around each"],[395.85316600000004,399.407916,"lobe so the angular step is thirty-six degrees."],[400.62212500000004,404.558416,"Add the circular offset to the lobe center to place each bead."],[405.772625,409.18262400000003,"The z coordinate selects the front or the back of the puzzle."],[410.462625,415.55687400000005,"Three lobes ten beads and two faces give sixty beads altogether."],[416.78420800000004,418.99475,"There are also three central pocket slots per"],[418.99475,422.76,"face Some slots are empty in each configuration."],[426.02545833333335,429.97491533333334,"A model that looks correct at rest may still intersect when it moves."],[431.70312433333334,434.6767913333333,"Turn the rotor sixty degrees The plastic and"],[434.6767913333333,437.7841663333333,"its carried beads share the same rigid rotation."],[439.5255413333333,442.4334583333333,"The channels now form a connected chamber Beads"],[442.4334583333333,445.97499933333336,"circulate around a thirty-slot route on each face."],[447.7163743333333,452.21849933333334,"Keep the discrete puzzle state separate from the animation between positions."],[453.94670833333333,458.98824933333333,"When the move finishes update which bead occupies each destination slot."],[460.71649933333333,465.42912433333333,"Now inspect a half-rim flip Watch the seam and the beads throughout the turn."],[467.1573333333333,472.7778333333333,"This is a geometric kinematic animation A physics engine is not moving the beads."],[476.0850826666666,481.1135416666666,"Materials lighting and small details give the model its finished appearance."],[481.40087466666665,484.4555826666666,"But the reusable construction method is underneath"],[484.5982496666666,487.58716566666664,"define flat regions and trace their boundaries."],[487.8614166666666,490.9403326666666,"Extrude the outlines round the edges and"],[490.9403326666666,493.57404166666663,"organize the parts around the correct pivots."],[493.8614166666666,496.3482496666666,"The companion example lets you inspect these"],[496.3482496666666,499.24508266666663,"stages and change the construction parameters."],[499.5192916666666,504.44241666666665,"After every change check that the channels align and the moving pieces still fit."]];const clock={t:0};window.captionCues=subtitles;window.paintSubtitles=function(t){const el=document.getElementById('subtitle');const cue=subtitles.find(c=>t>=c[0]&&t<c[1]);const text=cue?cue[2]:'';if(el.textContent!==text)el.textContent=text;};const tl=gsap.timeline({paused:true});tl.to(clock,{t:506.8,duration:506.8,ease:'none',onUpdate:()=>window.paintSubtitles(clock.t)},0);window.__timelines['captions-track']=tl;window.paintSubtitles(0);})();</script></template></body></html>
